appId: com.superk.mangatranslator
productName: SuperK
copyright: "SuperK Manga Translator"
electronVersion: 44.2.0

# Windows x64 portable target
win:
  target:
    - target: portable
      arch:
        - x64
  icon: ../public/icon-512.png

# Keep runtime files unpacked so Electron can spawn the local Node/Python
# services directly from disk.
asar: false

# electron-builder is executed with .desktop-stage as its project directory.
# Keeping the project boundary at the staged package prevents dependency
# discovery from falling back to the root project's full node_modules tree.
directories:
  output: ../dist/desktop

# The stage contains only the Electron shell and the exact Next.js standalone
# runtime. Its package.json intentionally has no production dependencies.
files:
  - "electron/**"
  - "!electron/**/*.test.*"
  - ".next/standalone/**"
  - "package.json"

# Runtime-only OCR resources live one directory above the staged app.
# Secrets such as .env files are never copied into these resources.
extraResources:
  - from: "../.desktop-runtime"
    to: "ocr-service/runtime"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
  - from: "../ocr-service/app"
    to: "ocr-service/app"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
  - from: "../ocr-service/models"
    to: "ocr-service/models"
    filter:
      - "**/*"
      - "!**/.gitkeep"

# Portable build: no installation or registry modifications.
portable:
  artifactName: SuperK-Windows-Portable.exe
