<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperK Translator</title>
<style>
:root { color-scheme: dark; --bg:#171717; --surface:#262626; --text:#fafafa; --muted:#b5b5b5; --accent:#efa2ba; }
* { box-sizing:border-box; }
body { width:350px; margin:0; padding:20px; background:var(--bg); color:var(--text); font:14px/1.55 system-ui,sans-serif; }
h1 { font-size:20px; margin:0 0 4px; }
p { margin:0 0 16px; color:var(--muted); }
label { display:block; margin:14px 0 6px; }
input,select,button { width:100%; padding:10px; border:1px solid #666; border-radius:6px; background:var(--surface); color:var(--text); font:inherit; }
input::placeholder { color:var(--muted); }
button { cursor:pointer; margin-top:16px; }
button:hover { background:#363636; }
button:disabled { cursor:wait; opacity:.65; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
#btnSave { background:var(--accent); color:#171717; border:0; font-weight:650; }
small { display:block; color:var(--muted); margin-top:6px; font-size:12px; }
#statusBadge { margin:12px 0 0; overflow-wrap:anywhere; }
.status-warn { color:#ffaaaa; }
.status-ready { color:#a7e5bf; }
.guide { border-top:1px solid #444; margin-top:20px; padding-top:14px; }
.guide p { margin-bottom:8px; }
</style>
</head>
<body>
<h1>SuperK Translator</h1>
<p>แปลภาพมังงะบนเว็บที่คุณกำลังอ่าน</p>
<form id="settingsForm">
<label for="translationMode">ระบบแปล</label>
<select id="translationMode">
<option value="server">ใช้ระบบ SuperK ของฉัน</option>
<option value="direct">ใช้ Gemini API Key โดยตรง</option>
</select>
<div id="serverSettings">
<label for="serverUrl">URL ระบบ SuperK</label>
<input id="serverUrl" type="url" placeholder="http://127.0.0.1:3000" aria-describedby="serverHint">
<small id="serverHint">เปิดระบบหลักไว้ระหว่างแปล ส่วนเสริมจะใช้คีย์ที่ตั้งไว้บนเซิร์ฟเวอร์</small>
</div>
<div id="directSettings" hidden>
<label for="apiKey">Gemini API Key</label>
<input id="apiKey" type="password" autocomplete="off" placeholder="AIzaSy...">
</div>
<label for="targetLang">แปลเป็นภาษา</label>
<select id="targetLang">
<option value="Thai">ไทย</option><option value="English">English</option>
<option value="Japanese">日本語</option><option value="Chinese">中文</option>
</select>
<details style="margin-top:14px"><summary>ตัวเลือกการแปลและแสดงผล</summary>
<label for="modelPreference">โมเดลแปล</label>
<select id="modelPreference">
<option value="auto">อัตโนมัติ</option>
<option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
<option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
<option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
<option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
<option value="gemini-3-flash">Gemini 3 Flash</option>
<option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
</select>
<label for="cleanMode">การลบข้อความเดิม</label>
<select id="cleanMode">
<option value="inpainting" selected>ลบข้อความต้นฉบับเนียนกริบ (Inpainting - แนะนำ)</option>
<option value="solid">ปิดข้อความเดิมด้วยพื้นขาว</option>
<option value="stroke">วางคำแปลโดยไม่ปิดภาพเดิม</option>
</select>
</details>
<button id="btnSave" type="submit">บันทึกการตั้งค่า</button>
<p id="statusBadge" role="status" aria-live="polite"></p>
</form>
<div class="guide">
<p>คลิกขวาที่ภาพ → <strong>แปลภาพมังงะด้วย SuperK</strong></p>
<small>ปุ่ม “ดูต้นฉบับ” ใช้สลับภาพก่อนและหลังแปล รองรับภาพบนเว็บทั่วไป ยกเว้นหน้าที่ Chrome จำกัดการเข้าถึง</small>
<button id="btnOpen" type="button">เปิดระบบ SuperK</button>
</div>
<script src="server.js"></script><script src="popup.js"></script>
</body>
</html>
