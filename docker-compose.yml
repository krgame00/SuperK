version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - SUPERK_CLEANER_URL=http://backend:8765
      - OCR_SERVICE_URL=http://backend:8765
    depends_on:
      - backend

  backend:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
